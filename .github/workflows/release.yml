name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          # The changelog is generated from commits since the previous tag, so
          # the full history has to be present.
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@e632b04fb1a8093e7c940c1dbd8ae4fb9b09bf5d # v0.11.130
        with:
          version: '0.11.147'
          install: 'false'
          packages: bun.com@1.4.4 git-scm.org@2.53.0 sqlite.org@3.54.1

      - name: Use Cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Convert and verify bundled content before publication
        run: |
          bun run assets:import
          bun run publication:check --channel github-release

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
