name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Provision managed tools
        uses: pantry-pm/pantry/packages/action@c83f6d9c8fa2d7a3345b3f9661a0c34750502cb5
        with:
          version: '0.11.127'
          install: 'false'
          packages: bun.com@1.4.4 git-scm.org@2.53.0 sqlite.org@3.54.1
      - run: bun install --frozen-lockfile
      - run: ./buddy lint
      - run: bun run typecheck
      # The original archive is verified per run and is not republished in a
      # shared Actions cache while redistribution evidence is unverified.
      - run: bun run assets:import
      - run: ./buddy test --unit
      - run: bun run assets:verify
      - run: ./buddy build views
      - name: Verify the production campaign in Chrome
        env:
          APP_ENV: production
          APP_KEY: base64:MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE=
        run: |
          mkdir -p storage/framework/runtime
          ./buddy serve --port 3450 > storage/framework/runtime/browser-server.log 2>&1 &
          settlers_server_pid=$!
          trap 'kill "$settlers_server_pid"' EXIT
          bun run test:browser http://127.0.0.1:3450/
          bun tests/browser/control-frame.ts http://127.0.0.1:3450/
          bun tests/browser/resize.ts http://127.0.0.1:3450/
          bun tests/browser/production.ts http://127.0.0.1:3450/
          bun tests/browser/selection.ts http://127.0.0.1:3450/
          bun tests/browser/recruitment.ts http://127.0.0.1:3450/
          bun tests/browser/working-area.ts http://127.0.0.1:3450/
          bun tests/browser/storage-inspection.ts http://127.0.0.1:3450/
          bun tests/browser/mine-placement.ts http://127.0.0.1:3450/
          bun tests/browser/skirmish.ts http://127.0.0.1:3450/
          bun tests/browser/rival-battle.ts http://127.0.0.1:3450/
          bun tests/browser/checkpoints.ts
          bun tests/browser/player-colors.ts
          bun tests/browser/shadows.ts
      # Original-media rasters remain local until reviewed permission exists.
      # Any future raster upload must pass publication:check for its channel.
      - name: Retain non-media browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-browser-check
          path: |
            storage/framework/runtime/shots/campaign.json
            storage/framework/runtime/shots/campaign-media.json
            storage/framework/runtime/shots/control-frame.json
            storage/framework/runtime/shots/control-frame-media.json
            storage/framework/runtime/shots/resize.json
            storage/framework/runtime/shots/resize-media.json
            storage/framework/runtime/shots/production.json
            storage/framework/runtime/shots/production-media.json
            storage/framework/runtime/shots/selection.json
            storage/framework/runtime/shots/selection-media.json
            storage/framework/runtime/shots/recruitment.json
            storage/framework/runtime/shots/recruitment-media.json
            storage/framework/runtime/shots/working-area.json
            storage/framework/runtime/shots/working-area-media.json
            storage/framework/runtime/shots/storage-inspection.json
            storage/framework/runtime/shots/storage-inspection-media.json
            storage/framework/runtime/shots/mine-placement.json
            storage/framework/runtime/shots/mine-placement-media.json
            storage/framework/runtime/shots/skirmish.json
            storage/framework/runtime/shots/skirmish-media.json
            storage/framework/runtime/shots/rival-battle.json
            storage/framework/runtime/shots/rival-battle-media.json
            storage/framework/runtime/shots/checkpoints.json
            storage/framework/runtime/shots/player-colors.json
            storage/framework/runtime/shots/player-colors-media.json
            storage/framework/runtime/shots/shadows.json
            storage/framework/runtime/shots/shadows-media.json
            storage/framework/runtime/browser-server.log
          if-no-files-found: ignore
